services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: kassa_development
      POSTGRES_USER: kassa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassa -d kassa_development"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - db-network

  api:
    image: ghcr.io/senne-geerts/kassa-app-api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kassa_development
      SPRING_DATASOURCE_USERNAME: kassa
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - db-network
    ports:
      - "8080:8080"

  frontend:
    image: ghcr.io/senne-geerts/kassa-app-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "80:80"

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
