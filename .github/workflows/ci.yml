name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and build
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/kassa_development
      SPRING_DATASOURCE_USERNAME: kassa
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kassa_development
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kassa -d kassa_development"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Test and build API
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=kassa-api
          cache-to: type=gha,scope=kassa-api,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://kassa.sennegeerts.com/api
          cache-from: type=gha,scope=kassa-frontend
          cache-to: type=gha,scope=kassa-frontend,mode=max

  publish-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: [api, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/senne-geerts/kassa-app-api:${{ github.sha }}
          cache-from: type=gha,scope=kassa-api
          cache-to: type=gha,scope=kassa-api,mode=max

      - name: Build and publish frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/senne-geerts/kassa-app-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://kassa.sennegeerts.com/api
          cache-from: type=gha,scope=kassa-frontend
          cache-to: type=gha,scope=kassa-frontend,mode=max
